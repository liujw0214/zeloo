apiVersion: v1
kind: Service
metadata:
  name: {{ include "zeloo.fullname" . }}
  labels:
    {{- include "zeloo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - name: http
    port: {{ .Values.service.httpPort }}
    targetPort: http
    protocol: TCP
  - name: metrics
    port: {{ .Values.service.metricsPort }}
    targetPort: metrics
    protocol: TCP
  selector:
    {{- include "zeloo.selectorLabels" . | nindent 4 }}