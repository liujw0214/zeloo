# ─── Default values for zeloo ───────────────────────────────────────────────
# This is a YAML-formatted file.
# Override any value when installing:
#   helm install zeloo ./helm/zeloo --set replicaCount=3

# ─── Image ───────────────────────────────────────────────────────────────────
image:
  repository: zeloo/zeloo
  tag: "0.16.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ─── Replicas & strategy ────────────────────────────────────────────────────
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# ─── Container ports ─────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 80
  httpTargetPort: 8000
  metricsPort: 9090
  metricsTargetPort: 9090

# ─── Resources ───────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# ─── Probes ──────────────────────────────────────────────────────────────────
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

# ─── Security context ────────────────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false

# ─── Application configuration (ConfigMap) ───────────────────────────────────
config:
  provider: "anthropic"
  model: "claude-3-5-sonnet"
  log_level: "INFO"
  fallback_chain: "anthropic,openai,deepseek"
  enable_telemetry: "true"

# ─── Secrets (replace in production) ─────────────────────────────────────────
secrets:
  openaiApiKey: "REPLACE_ME"
  anthropicApiKey: "REPLACE_ME"
  githubToken: "REPLACE_ME"

# ─── Persistent storage ──────────────────────────────────────────────────────
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  mountPath: /data

# ─── Horizontal Pod Autoscaler ───────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ─── Ingress ─────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: zeloo.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: zeloo-tls

# ─── Prometheus ServiceMonitor ───────────────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    app: zeloo

# ─── Pod-level extras ────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"