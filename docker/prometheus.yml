# Prometheus scrape config for Zeloo gateway.
# Exposed at 127.0.0.1:9091 when --profile metrics is enabled.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: zeloo-prod

scrape_configs:
  # ── Zeloo gateway (assumes /metrics is exposed) ────────────────────
  - job_name: zeloo-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: zeloo
          tier: gateway

  # ── Prometheus self-scrape ─────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]