name: Performance Regression

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: "Git ref to compare against"
        required: false
        default: "main"

concurrency:
  group: perf-regression
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen

      - name: Run benchmark suite
        run: uv run python -m pytest tests/perf/ --benchmark-json=benchmark-results.json --tb=short -v
        continue-on-error: true

      - name: Run long-session stability tests
        run: uv run python -m pytest tests/unit/test_long_session_stability.py --tb=short -v
        continue-on-error: true

      - name: Memory leak detection
        run: uv run python scripts/memory_leak_check.py
        continue-on-error: true

      - name: SQLite benchmarks
        run: uv run python scripts/sqlite_bench.py
        continue-on-error: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: benchmark-results.json memory-leak-check.json sqlite-bench.json
          retention-days: 90

  baseline-compare:
    name: Compare with Baseline
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.baseline_ref || 'main' }}
          path: baseline

      - name: Checkout current
        uses: actions/checkout@v7
        with:
          path: current

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
        run: pip install uv && uv sync --frozen

      - name: Run baseline benchmarks
        run: uv run python -m pytest tests/perf/ --benchmark-json=baseline.json -q --tb=no
        continue-on-error: true
        working-directory: ./baseline

      - name: Run current benchmarks
        run: uv run python -m pytest tests/perf/ --benchmark-json=current.json -q --tb=no
        continue-on-error: true
        working-directory: ./current

      - name: Compare results
        run: |
          uv run python scripts/perf_compare.py baseline/baseline.json current/current.json
        continue-on-error: true

      - name: Upload comparison
        uses: actions/upload-artifact@v7
        with:
          name: perf-compare
          path: perf_compare.json
          retention-days: 30
