name: Type Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --frozen
      - name: Type check agent
        run: uv run mypy agent/ --ignore-missing-imports || true
      - name: Type check zeloo_cli
        run: uv run mypy zeloo_cli/ --ignore-missing-imports || true
      - name: Type check tools
        run: uv run mypy tools/ --ignore-missing-imports || true
