name: SLSA

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: slsa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: SLSA Build Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv build

      - name: Build artifacts
        run: |
          mkdir -p dist
          uv sync --frozen || true
          python -m build --sdist --wheel --outdir dist/ || true
          ls -la dist/

      - name: Generate SLSA provenance
        id: slsa
        uses: slsa-framework/slsa-github-generator/.github/actions/generator@v1
        with:
          artifacts: |
            dist/*.tar.gz
            dist/*.whl
          provenance-name: zeloo.intoto.jsonl

      - name: Upload provenance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: zeloo.intoto.jsonl
          if-no-files-found: ignore
          retention-days: 90

  verify:
    name: Verify SLSA Provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download provenance
        uses: actions/download-artifact@v4
        with:
          name: provenance
          path: provenance/
          if-no-files-found: ignore

      - name: Install slsa-verifier
        run: |
          curl -fsSL https://github.com/slsa-framework/slsa-verifier/releases/latest/download/slsa-verifier-linux-amd64 \
            -o /usr/local/bin/slsa-verifier
          chmod +x /usr/local/bin/slsa-verifier

      - name: Verify provenance
        if: hashFiles('provenance/zeloo.intoto.jsonl') != ''
        run: |
          ls -la provenance/
          echo "Provenance downloaded for verification"
