name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and merge Dependabot PR
        uses: github/actions-approve-and-merge@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          approve-and-merge-method: squash
          dry-run: false
          min-approvals: 0
          excluded-pull-requests: []

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Dependabot auto-merge failed for PR #${{ github.event.pull_request.number }}"
          echo "Please review manually: ${{ github.event.pull_request.html_url }}"
