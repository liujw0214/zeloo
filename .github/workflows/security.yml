name: Security Audit

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 0"  # Weekly on Sunday
  workflow_dispatch:

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv pip audit || true

  code-security:
    name: Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - name: Check for exposed secrets
        run: |
          uv run ruff check . --select=S105 --output-format=concise || true
      - name: Check for banned functions
        run: |
          uv run ruff check . --select=S301 --output-format=concise || true
