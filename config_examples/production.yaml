# Zeloo Production Environment Configuration
# 用途：生产部署，最小日志，禁用调试功能，严格安全
# 使用：ZELOO_ENV=production 或将本文件复制为 config.yaml

zeloo:
  log_level: WARNING
  verbose: false
  quiet: false
  trace_enabled: false
  telemetry_dry_run: false

llm:
  # 生产优先 claude（更强的推理与代码能力）
  default_provider: anthropic
  default_model: claude-3-5-sonnet
  providers:
    anthropic:
      enabled: true
      api_key: ${ANTHROPIC_API_KEY}
      max_retries: 3
    openai:
      enabled: true
      api_key: ${OPENAI_API_KEY}
      fallback_only: true  # 仅作为降级
    # 生产禁用所有非必需 provider
    deepseek:
      enabled: false
    groq:
      enabled: false
    ollama:
      enabled: false

agent:
  max_iterations: 10  # 生产严格限制，避免单次任务失控
  temperature: 0.3
  timeout_seconds: 60
  step_timeout_seconds: 30
  keep_full_trace: false
  # 启用熔断器
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    reset_timeout_seconds: 60

memory:
  backend: redis  # 生产用 Redis，多实例共享
  redis_url: ${REDIS_URL}
  cache_ttl: 3600
  user_profile_enabled: true
  max_chars: 16000
  # 启用持久化备份
  backup_enabled: true
  backup_interval_hours: 6

terminal:
  # 生产使用 docker 沙箱隔离执行
  backend: docker
  timeout: 30
  docker:
    image: python:3.12-slim
    # 限制资源
    memory_limit: 512m
    cpu_limit: 1.0
    network_mode: none  # 沙箱无网络

voice:
  enabled: false  # 生产默认关闭语音
  backend: console

gateway:
  enabled: true
  api:
    host: 0.0.0.0
    port: 9113
    # 生产启用速率限制，防滥用
    rate_limit_capacity: 60
    rate_limit_rate: 1.0
    # 通过环境变量注入 token，绝不硬编码
    auth_tokens:
      - ${ZELOO_API_KEY}
    # 强制 HTTPS
    tls:
      enabled: true
      cert_file: ${TLS_CERT_PATH}
      key_file: ${TLS_KEY_PATH}
  session_idle_timeout: 3600
  eviction_interval: 300
  platforms: {}

mcp:
  # 生产按需配置，最小暴露面
  servers: []
  # 禁用通过环境变量动态加载未授权 MCP
  allow_dynamic_load: false

browser:
  headless: true
  timeout: 30000
  save_screenshots: false
  # 限制单实例并发浏览器数
  max_concurrent: 5

telemetry:
  enabled: true
  endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  service_name: zeloo-prod
  exporter: otlp
  # 生产环境低采样率，控制遥测成本
  sample_ratio: 0.1

self_evolution:
  background_review: true
  prompt_optimizer: false  # 生产关闭 prompt 自动改写，避免行为漂移
  review_interval_minutes: 60

smart_model_routing:
  enabled: true
  complexity_threshold: 0.5
  cheap_model: claude-3-haiku
  expensive_model: claude-3-5-sonnet

context:
  compression:
    enabled: true
    trigger_tokens: 80000
    strategy: summarize_then_truncate

curator:
  enabled: true
  auto_curate: true
  curate_interval_minutes: 60
  retention_days: 90

security:
  # 生产严格开启所有安全检查
  sanitize_input: true
  validate_output: true
  threat_scan: true
  rate_limit: true
  # 输出扫描严格模式
  output_scan_strict: true
  # 禁用危险工具直接执行
  dangerous_policy: confirm

# Vault 集中管理生产密钥
vault:
  enabled: true
  url: ${VAULT_URL}
  token: ${VAULT_TOKEN}
  # 密钥轮转
  rotation_interval_hours: 24