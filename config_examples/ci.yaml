# Zeloo CI Environment Configuration
# 用途：GitHub Actions / GitLab CI 等持续集成
# 设计原则：完全确定性、快速失败、不产生外部副作用

zeloo:
  log_level: INFO
  verbose: false
  quiet: true  # CI 环境静默模式，避免污染测试输出
  trace_enabled: false
  # CI 环境固定机器标识
  instance_id: ci-runner

llm:
  # CI 用 mock provider，避免真实计费与外部网络依赖
  default_provider: mock
  providers:
    mock:
      enabled: true
      base_url: http://localhost:9999/mock  # mock LLM server
      # 固定响应模式
      response_mode: deterministic
    openai:
      enabled: false
    anthropic:
      enabled: false

agent:
  max_iterations: 5          # CI 任务通常较简单
  temperature: 0.0            # CI 测试确定性
  timeout_seconds: 30         # CI 快速失败
  step_timeout_seconds: 10
  keep_full_trace: false
  # CI 启用熔断器
  circuit_breaker:
    enabled: true
    failure_threshold: 2
    reset_timeout_seconds: 5

memory:
  # CI 用 SQLite 文件，测试结束后清理
  backend: sqlite
  path: ${ZELOO_CI_TMPDIR:-/tmp/zeloo-ci}/memory.db
  cache_ttl: 60
  user_profile_enabled: false  # CI 不写入用户画像
  max_chars: 2000

terminal:
  backend: local
  timeout: 10
  cwd: ${ZELOO_CI_TMPDIR:-/tmp/zeloo-ci}

voice:
  enabled: false
  backend: console

gateway:
  enabled: false  # CI 不启动网关服务
  api:
    enabled: false
  platforms: {}

mcp:
  # CI 不加载任何 MCP，最小化依赖
  servers: []
  allow_dynamic_load: false

browser:
  headless: true
  timeout: 10000  # CI 快速失败
  save_screenshots: false

telemetry:
  enabled: false  # CI 禁用遥测，避免外部上报

self_evolution:
  background_review: false  # CI 关闭后台复盘
  prompt_optimizer: false

smart_model_routing:
  enabled: false  # CI 走单一 mock provider

context:
  compression:
    enabled: false  # CI 上下文较短，无需压缩

curator:
  enabled: false  # CI 不进行记忆整理

security:
  sanitize_input: true
  validate_output: true
  threat_scan: true
  rate_limit: false  # CI 无并发流量

# CI 关闭 Vault，使用 .env.ci 注入的临时密钥
vault:
  enabled: false