# Zeloo — Production environment
# Usage: zeloo_ENV=prod python cli.py
# Production defaults: full toolset, secure gateways, background evolution on.

model: gpt-4o
provider: openai
temperature: 0.0
max_tokens: 4096

max_iterations: 90

terminal:
  backend: docker  # sandboxed execution in prod
  timeout: 30

voice:
  backend: console

memory:
  enabled: true
  user_profile_enabled: true
  max_chars: 8000

self_evolution:
  background_review:
    enabled: true
    model: null
    interval_minutes: 30

mcp:
  servers: []

gateway:
  session_idle_timeout: 3600
  eviction_interval: 300
  api:
    enabled: true
    host: 0.0.0.0
    port: 9113
    auth:
      tokens: []  # set via zeloo_API_TOKEN env var
  platforms: {}
