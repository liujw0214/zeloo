# Zeloo — Development environment
# Usage: zeloo_ENV=dev python cli.py
# Local development: verbose logging, local terminal, no external gateways.

model: gpt-4o-mini
provider: openai
temperature: 0.2
max_tokens: 2048

max_iterations: 30

terminal:
  backend: local
  timeout: 15

voice:
  backend: console

memory:
  enabled: true
  user_profile_enabled: true
  max_chars: 4000

self_evolution:
  background_review:
    enabled: false  # disabled in dev to avoid noise

mcp:
  servers: []

gateway:
  session_idle_timeout: 600
  eviction_interval: 120
  api:
    enabled: false
  platforms: {}
