[project]
name = "Zeloo"
version = "0.1.0.dev0"
description = "Zeloo — self-hosted, self-evolving AI agent runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Zeloo Project" }]
keywords = ["ai", "agent", "cli", "llm", "self-hosted", "hermes-alternative"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/zeloo/zeloo"
Repository = "https://github.com/zeloo/zeloo"
Documentation = "https://docs.zeloo.io"
"Bug Tracker" = "https://github.com/zeloo/zeloo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pytest-asyncio>=0.23",
    "anyio>=4.0",
    "textual>=0.60",
]
voice = ["sounddevice>=0.4.6"]
browser = ["playwright>=1.40"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60", "rich>=13.0"]
computer-use = ["pyautogui>=0.4.54", "pygetwindow>=0.0.9", "Pillow>=10.0.0"]

[project.scripts]
Zeloo = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "agent",
    "tools",
    "gateway",
    "zeloo_state",
    "terminal",
    "zeloo_cli",
    "workspace",
    "cron",
    "mcp",
    "plugins",
    "optional_mcps",
    "datagen",
    "locales",
    "scripts",
    "config_examples",
    "environments",
    "optional_skills",
    "model_providers",
    "native",
    "video_gen",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"optional_skills/**" = ["E501"]
"evals/**" = ["E501"]
"scripts/**" = ["E501"]
"model_providers/**" = ["E501"]
"optional_mcps/**" = ["E501"]
"tests/**" = ["E501", "UP038"]
"tools/**" = ["UP038"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (use -m not slow to deselect)",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
]
