# Gateway configuration — multi-platform deployment.
# Enables Telegram, Discord, and the OpenAI-compatible API server.

model: gpt-4o
provider: openai
temperature: 0.0
max_tokens: 4096
max_iterations: 90

terminal:
  backend: local
  timeout: 30

gateway:
  session_idle_timeout: 3600
  eviction_interval: 300

  # OpenAI-compatible HTTP API (for programmatic access)
  api:
    enabled: true
    host: 0.0.0.0
    port: 9113

  # Multi-profile routing: different users get different tool sets
  profiles:
    default:
      model: gpt-4o
      provider: openai
      toolsets: [web, terminal, file, browser, code_execution, delegation, skills, memory, todo, mcp, cron, voice, image]
    coder:
      model: gpt-4o
      provider: openai
      toolsets: [terminal, file, code_execution, web, memory, todo]
  user_profiles:
    "admin_user": coder

  platforms:
    telegram:
      enabled: true
      token: ${TELEGRAM_BOT_TOKEN}
      allowed_users: []
    discord:
      enabled: true
      token: ${DISCORD_BOT_TOKEN}
      guild_id: null
      allowed_users: []

memory:
  enabled: true
  user_profile_enabled: true
  max_chars: 8000

self_evolution:
  background_review:
    enabled: false
