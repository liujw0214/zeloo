ShortDescription: Self-hosted, self-evolving resident AI Agent runtime
Description: |-
  Zeloo is a self-hosted, self-evolving resident AI Agent runtime framework.

  It ships with a three-layer System Prompt (stable / context / volatile), multi-provider
  LLM routing across 40+ backends, more than 90 built-in tools (file, web, shell,
  code execution, browser, image gen), 18+ messaging platform adapters (Telegram,
  Discord, Slack, WeChat, Lark, ...) and 39 web search providers (Tavily, Brave,
  Perplexity, Google, Bing, SerpAPI, ...).

  Workspace state is persisted in SQLite with FTS5 indexing; skills can be hot
  reloaded, evolved, and audited via the curator lifecycle. The project is
  designed for self-hosted, single-tenant operation on a developer machine or
  a small VPS.
