# Zeloo Agent — production docker-compose
#
# Differences from docker-compose.yml (dev):
#   * Hardened: non-root user, read-only filesystem, drop capabilities
#   * Persistent volumes for state DB, secrets, master key, WAL archive
#   * Off-host backup container that pushes snapshots to S3 / OSS / local
#   * Prometheus metrics endpoint exposed for scraping
#   * Reverse-proxy-friendly: no host port published by default
#   * Resource limits, healthchecks with start_period
#   * Named networks (frontend / backend) for tier isolation
#
# Usage:
#   cp .env.example .env   # fill in OPENAI_API_KEY, etc.
#   docker compose -f docker-compose.prod.yml --profile gateway up -d
#   docker compose -f docker-compose.prod.yml --profile backup up -d
#
# Verify:
#   curl http://localhost:8080/health
#   docker compose -f docker-compose.prod.yml ps
#   docker compose -f docker-compose.prod.yml logs --tail=50 gateway

name: zeloo-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    labels: "service,profile,zeloo_env"

x-restart: &default-restart
  restart: unless-stopped

x-common-env: &common-env
  zeloo_ENV: prod
  zeloo_HOME: /var/lib/Zeloo
  zeloo_DATA_DIR: /var/lib/Zeloo
  zeloo_MODE: ${zeloo_MODE:-gateway}
  zeloo_MODEL: ${zeloo_MODEL:-gpt-4o}
  zeloo_PROVIDER: ${zeloo_PROVIDER:-openai}
  zeloo_BG_REVIEW: "true"
  zeloo_STREAM: "true"
  zeloo_DANGEROUS_POLICY: confirm
  zeloo_API_TOKEN: ${zeloo_API_TOKEN:-}
  zeloo_FALLBACK_PROVIDERS: ${zeloo_FALLBACK_PROVIDERS:-}
  zeloo_COST_WARN_THRESHOLD: ${zeloo_COST_WARN_THRESHOLD:-10}
  zeloo_COST_ABORT_THRESHOLD: ${zeloo_COST_ABORT_THRESHOLD:-100}
  # Off-host backup
  OFFHOST_BACKEND: ${OFFHOST_BACKEND:-local}
  OFFHOST_LOCAL_DIR: /var/lib/Zeloo-offhost
  OFFHOST_S3_BUCKET: ${OFFHOST_S3_BUCKET:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  OSS_BUCKET: ${OSS_BUCKET:-}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
  # Provider keys
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

services:
  # ─────────────────────────────────────────────────────────────────────
  # Gateway service — HTTP API + multi-platform bot
  # ─────────────────────────────────────────────────────────────────────
  gateway:
    <<: *default-restart
    build:
      context: .
      dockerfile: Dockerfile
    image: zeloo:prod
    container_name: zeloo-gateway
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=32m,mode=0755
    environment:
      <<: *common-env
      zeloo_MODE: gateway
    volumes:
      # Persistent state — DB, credentials, master key, archive
      - zeloo-state:/var/lib/Zeloo:rw
      # Skill library (read-only mount for safety)
      - ./skills:/var/lib/Zeloo/skills:ro
      # Optional read-only config overrides
      - ./config.yaml:/app/config.yaml:ro
      - ./environments:/app/environments:ro
    ports:
      # Bind to localhost only by default — fronted by a reverse proxy
      # (Traefik / Caddy / nginx) in production.
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
      - "9090"  # Prometheus metrics
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,socket; socket.setdefaulttimeout(5); urllib.request.urlopen('http://localhost:8080/health').read()\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - zeloo-frontend
      - zeloo-backend
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    profiles:
      - gateway

  # ─────────────────────────────────────────────────────────────────────
  # CLI service — interactive (manual)
  # ─────────────────────────────────────────────────────────────────────
  cli:
    <<: *default-restart
    image: zeloo:prod
    container_name: zeloo-cli
    user: "1000:1000"
    stdin_open: true
    tty: true
    environment:
      <<: *common-env
      zeloo_MODE: cli
    volumes:
      - zeloo-state:/var/lib/Zeloo:rw
      - ./skills:/var/lib/Zeloo/skills:ro
      - .:/workspace:ro
    logging: *default-logging
    networks:
      - zeloo-backend
    profiles:
      - cli

  # ─────────────────────────────────────────────────────────────────────
  # Cron service — scheduled backups + PITR archive
  # (uses the same image; entrypoint switches to cron scheduler)
  # ─────────────────────────────────────────────────────────────────────
  cron:
    <<: *default-restart
    image: zeloo:prod
    container_name: zeloo-cron
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *common-env
      zeloo_MODE: cron
      ZELOO_CRON_SCHEDULE: ${ZELOO_CRON_SCHEDULE:-"0 */1 * * *"}
    volumes:
      - zeloo-state:/var/lib/Zeloo:rw
      # Local second copy of WAL archive
      - zeloo-offhost:/var/lib/Zeloo-offhost:rw
    command: ["cron"]
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /var/lib/Zeloo/.cron_healthy"
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    networks:
      - zeloo-backend
    profiles:
      - cron

  # ─────────────────────────────────────────────────────────────────────
  # Off-host backup uploader — pulls from zeloo-offhost volume
  # Runs nightly by default; pushes to S3 / OSS / second disk.
  # ─────────────────────────────────────────────────────────────────────
  backup:
    <<: *default-restart
    image: zeloo:prod
    container_name: zeloo-backup
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *common-env
      zeloo_MODE: backup
      ZELOO_BACKUP_SCHEDULE: ${ZELOO_BACKUP_SCHEDULE:-"0 3 * * *"}
      ZELOO_BACKUP_KEEP_DAYS: ${ZELOO_BACKUP_KEEP_DAYS:-30}
    volumes:
      - zeloo-state:/var/lib/Zeloo:ro
      - zeloo-offhost:/var/lib/Zeloo-offhost:rw
    command: ["backup"]
    healthcheck:
      test:
        - CMD-SHELL
        - "test -f /var/lib/Zeloo-offhost/.backup_healthy"
      interval: 24h
      timeout: 30s
      retries: 3
      start_period: 60s
    logging: *default-logging
    networks:
      - zeloo-backend
    profiles:
      - backup

  # ─────────────────────────────────────────────────────────────────────
  # Optional reverse proxy (Caddy) — exposes 80/443 with auto-TLS
  # Disable if you front this with your own nginx / Traefik / Cloudflare.
  # ─────────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: zeloo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data:rw
      - caddy-config:/config:rw
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-zeloo.local}
    depends_on:
      gateway:
        condition: service_healthy
    logging: *default-logging
    networks:
      - zeloo-frontend
    profiles:
      - caddy
      - gateway

  # ─────────────────────────────────────────────────────────────────────
  # Prometheus — scrape the /metrics endpoint exposed by gateway
  # ─────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: zeloo-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus:rw
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - gateway
    logging: *default-logging
    networks:
      - zeloo-backend
    profiles:
      - metrics

# ─────────────────────────────────────────────────────────────────────
# Volumes — persistent state lives outside the container
# ─────────────────────────────────────────────────────────────────────
volumes:
  zeloo-state:
    driver: local
    name: zeloo_state_prod
  zeloo-offhost:
    driver: local
    name: zeloo_offhost_prod
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local

# ─────────────────────────────────────────────────────────────────────
# Networks — frontend (public-facing) / backend (intra-stack)
# ─────────────────────────────────────────────────────────────────────
networks:
  zeloo-frontend:
    driver: bridge
    name: zeloo_frontend
  zeloo-backend:
    driver: bridge
    internal: false
    name: zeloo_backend