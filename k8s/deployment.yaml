apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeloo
  labels:
    app: zeloo
    version: v0.16.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zeloo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: zeloo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: zeloo
        image: zeloo/zeloo:v0.16.0
        ports:
        - name: http
          containerPort: 8000
        - name: metrics
          containerPort: 9090
        env:
        - name: zeloo_HOME
          value: /data
        - name: zeloo_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: zeloo-config
              key: provider
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: zeloo-secrets
              key: openai-api-key
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zeloo-data